name: CI

on:
  push:
  pull_request:

jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libsecret-1-dev libreadline-dev
      - name: Build Linux target
        run: |
          make clean
          make
      - name: Smoke test binary
        run: |
          ./envchain 2>&1 | grep "Usage:"

  wsl-backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build forced WSL backend
        run: |
          make clean
          make ENVCHAIN_FORCE_WSL=1
      - name: Create fake envchain.exe bridge
        run: |
          cat > fake-envchain.exe <<'EOF'
          #!/usr/bin/env sh
          if [ "$1" = "--list" ] && [ "$2" = "--show-value" ]; then
            if [ "$3" = "aws" ]; then
              echo AWS_ACCESS_KEY_ID=test-key
              echo AWS_SECRET_ACCESS_KEY=test-secret
              exit 0
            fi
            exit 1
          fi
          if [ "$1" = "--list" ]; then
            echo aws
            exit 0
          fi
          if [ "$1" = "--set" ] || [ "$1" = "--unset" ]; then
            exit 0
          fi
          exit 1
          EOF
          chmod +x fake-envchain.exe
      - name: Smoke test WSL backend behavior
        run: |
          ENVCHAIN_WINDOWS_BIN=./fake-envchain.exe ./envchain --list | grep "^aws$"
          ENVCHAIN_WINDOWS_BIN=./fake-envchain.exe ./envchain aws env | grep "^AWS_ACCESS_KEY_ID=test-key$"
          ENVCHAIN_WINDOWS_BIN=./fake-envchain.exe ./envchain aws env | grep "^AWS_SECRET_ACCESS_KEY=test-secret$"

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build Windows target
        shell: cmd
        run: |
          for /f "usebackq delims=" %%i in (`"%ProgramFiles(x86)%\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath`) do set "VSINSTALL=%%i"
          if not defined VSINSTALL exit /b 1
          call "%VSINSTALL%\Common7\Tools\VsDevCmd.bat" -arch=x64 -host_arch=x64
          nmake /f Makefile.win clean
          nmake /f Makefile.win
      - name: Smoke test Windows credential flow
        shell: cmd
        run: |
          echo test-secret| .\envchain.exe --set ci AWS_SECRET_ACCESS_KEY
          .\envchain.exe --list | findstr /r "^ci$"
          .\envchain.exe ci cmd /c echo %%AWS_SECRET_ACCESS_KEY%% > value.txt
          set /p RESULT=<value.txt
          if not "%RESULT%"=="test-secret" exit /b 1
          .\envchain.exe --unset ci AWS_SECRET_ACCESS_KEY
