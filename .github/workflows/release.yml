name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  windows-asset:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Derive release version
        shell: powershell
        run: |
          $v = "${env:GITHUB_REF_NAME}".TrimStart('v')
          "VERSION=$v" | Out-File -FilePath $env:GITHUB_ENV -Encoding ascii -Append
      - name: Build Windows executable
        shell: cmd
        run: |
          for /f "usebackq delims=" %%i in (`"%ProgramFiles(x86)%\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath`) do set "VSINSTALL=%%i"
          if not defined VSINSTALL exit /b 1
          call "%VSINSTALL%\Common7\Tools\VsDevCmd.bat" -arch=x64 -host_arch=x64
          nmake /f Makefile.win clean
          nmake /f Makefile.win VERSION=%VERSION%
      - name: Rename Windows asset
        shell: powershell
        run: |
          New-Item -ItemType Directory -Path dist -Force | Out-Null
          Copy-Item envchain.exe "dist\envchain-windows-x86_64-${env:VERSION}.exe"
      - name: Upload Windows asset artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-asset
          path: dist/envchain-windows-x86_64-*.exe

  debian-asset:
    runs-on: ubuntu-latest
    container:
      image: debian:trixie
    steps:
      - uses: actions/checkout@v4
      - name: Install Debian build dependencies
        run: |
          apt-get update
          apt-get install -y build-essential pkg-config libsecret-1-dev libreadline-dev dpkg-dev
      - name: Derive release version
        run: |
          echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"
      - name: Build Linux binary
        run: |
          make clean
          make VERSION="$VERSION"
      - name: Build Debian package
        run: |
          sh scripts/build-deb.sh "$VERSION"
      - name: Upload Debian asset artifact
        uses: actions/upload-artifact@v4
        with:
          name: debian-asset
          path: dist/envchain_*.deb

  debian-wsl-asset:
    runs-on: ubuntu-latest
    container:
      image: debian:trixie
    steps:
      - uses: actions/checkout@v4
      - name: Install Debian build dependencies
        run: |
          apt-get update
          apt-get install -y build-essential pkg-config dpkg-dev
      - name: Derive WSL release version
        run: |
          BASE_VERSION="${GITHUB_REF_NAME#v}"
          echo "WSL_VERSION=${BASE_VERSION}.wsl" >> "$GITHUB_ENV"
      - name: Build WSL backend binary
        run: |
          make clean
          make ENVCHAIN_FORCE_WSL=1 VERSION="$WSL_VERSION"
      - name: Build WSL Debian package
        run: |
          sh scripts/build-deb.sh "$WSL_VERSION"
      - name: Upload WSL Debian asset artifact
        uses: actions/upload-artifact@v4
        with:
          name: debian-wsl-asset
          path: dist/envchain_*.wsl_*.deb

  publish:
    needs: [windows-asset, debian-asset, debian-wsl-asset]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            dist/windows-asset/*.exe
            dist/debian-asset/*.deb
            dist/debian-wsl-asset/*.deb
